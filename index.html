<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسیر پیشرفت من</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; }
        header { background-color: #4CAF50; color: white; text-align: center; padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        main { padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .progress-bar { background-color: #e0e0e0; border-radius: 10px; height: 20px; overflow: hidden; margin-top: 10px; }
        .progress-fill { background-color: #4CAF50; height: 100%; width: 0%; text-align: center; color: white; line-height: 20px; font-size: 12px; transition: width 0.3s ease; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px 0; border-bottom: 1px solid #eee; }
        button { background-color: #2196F3; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-family: inherit; }
    </style>
</head>
<body>
    <header>
        <h1>مسیر پیشرفت</h1>
        <p>برنامه‌ریزی و اهداف شخصی</p>
    </header>

    <main>
        <div class="card">
            <h2>درصد پیشرفت امروز</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill">0%</div>
            </div>
        </div>

        <div class="card">
            <h2>کارهای امروز</h2>
            <ul id="task-list">
                <li><label><input type="checkbox"> مطالعه کتاب</label></li>
                <li><label><input type="checkbox"> ورزش صبحگاهی</label></li>
                <li><label><input type="checkbox"> یادگیری برنامه‌نویسی</label></li>
            </ul>
            <button onclick="addTask()">+ افزودن کار جدید</button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressFill = document.getElementById('progress-fill');
            const taskList = document.getElementById('task-list');

            function updateProgress() {
                const total = taskList.querySelectorAll('input[type="checkbox"]').length;
                const checked = taskList.querySelectorAll('input[type="checkbox"]:checked').length;
                const percentage = total === 0 ? 0 : Math.round((checked / total) * 100);
                progressFill.style.width = percentage + '%';
                progressFill.textContent = percentage + '%';
            }

            taskList.addEventListener('change', (e) => {
                if (e.target.type === 'checkbox') updateProgress();
            });

            window.addTask = function() {
                const taskName = prompt("نام کار جدید را وارد کنید:");
                if (taskName) {
                    const li = document.createElement('li');
                    li.innerHTML = `<label><input type="checkbox"> ${taskName}</label>`;
                    taskList.appendChild(li);
                }
            };
        });
    </script>
</body>
</html>
